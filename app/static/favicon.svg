<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Design 1: bracket [w] — leverages the existing [wgflow] panel
       brand. Square dark background ensures the icon reads on light
       tab strips as well as dark. Phosphor-green strokes and glyph,
       slightly inset so the brackets aren't kissing the edge. -->
  <rect width="64" height="64" rx="8" fill="#0a0d0b"/>
  <!-- Left bracket -->
  <path d="M 16 16 L 11 16 L 11 48 L 16 48"
        fill="none" stroke="#8bff6a" stroke-width="3"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Right bracket -->
  <path d="M 48 16 L 53 16 L 53 48 L 48 48"
        fill="none" stroke="#8bff6a" stroke-width="3"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Letter w. Built from straight strokes so it stays crisp at
       16px without anti-aliasing artifacts. The two V shapes are
       sized so the inner peak sits at the visual center. -->
  <path d="M 19 24 L 25 42 L 32 30 L 39 42 L 45 24"
        fill="none" stroke="#8bff6a" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
